<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaskForge — Polygon Annotation Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- TOOLBAR -->
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="logo">⬡ MaskForge</span>
      <div class="tool-group">
        <button class="tool-btn active" data-tool="select" title="Select / Pan">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 4l7 18 3-7 7-3z" fill="currentColor"/></svg>
          <span>Select</span>
        </button>
        <button class="tool-btn" data-tool="polygon" title="Draw Polygon">
          <svg viewBox="0 0 24 24" width="14" height="14"><polygon points="12,3 21,9 18,21 6,21 3,9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Polygon</span>
        </button>
        <button class="tool-btn" data-tool="rect" title="Draw Rectangle">
          <svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Rect</span>
        </button>
        <button class="tool-btn" data-tool="circle" title="Draw Circle">
          <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Circle</span>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="Draw Ellipse">
          <svg viewBox="0 0 24 24" width="14" height="14"><ellipse cx="12" cy="12" rx="10" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Ellipse</span>
        </button>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="action-btn" id="btn-load-image" title="Load Image">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z" fill="currentColor"/></svg>
        Image
      </button>
      <button class="action-btn" id="btn-load-json" title="Load JSON">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        JSON
      </button>
      <button class="action-btn accent" id="btn-export">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
      <input type="file" id="file-image" accept="image/*" style="display:none" />
      <input type="file" id="file-json" accept=".json,application/json" style="display:none" />
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="workspace">
    <section class="canvas-panel">
      <div class="zoom-controls">
        <button id="zoom-in" title="Zoom In">+</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-out" title="Zoom Out">−</button>
        <button id="zoom-fit" title="Fit to View">⊡</button>
      </div>
      <div class="canvas-container" id="canvas-container">
        <canvas id="main-canvas"></canvas>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">⬡</div>
          <p>Load an image to begin annotating</p>
          <p class="empty-sub">Drag &amp; drop or use the toolbar buttons</p>
        </div>
      </div>
      <div class="status-bar" id="status-bar">Ready</div>
    </section>

    <aside class="list-panel" id="list-panel">
      <div class="panel-header">
        <span>Annotations</span>
        <span class="badge" id="ann-count">0</span>
      </div>
      <div class="list-scroll" id="annotation-list">
        <div class="list-empty">No annotations loaded</div>
      </div>
    </aside>
  </main>

  <!-- MODAL: New / Edit Annotation -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modal-title">New Annotation</span>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Label / Name
          <input type="text" id="modal-name" placeholder="e.g. wire, pad, chip" autocomplete="off" />
        </label>
        <div class="attr-section">
          <div class="attr-header">
            <span>Custom Attributes</span>
            <button class="small-btn" id="add-attr">+ Add</button>
          </div>
          <div id="attr-list"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="action-btn danger" id="modal-delete" style="display:none">Delete</button>
        <div class="modal-spacer"></div>
        <button class="action-btn" id="modal-cancel">Cancel</button>
        <button class="action-btn accent" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- CONTEXT MENU (right-click) -->
  <div class="context-menu" id="context-menu">
    <button data-action="edit">✎ Edit Annotation</button>
    <button data-action="delete">✕ Delete Annotation</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
